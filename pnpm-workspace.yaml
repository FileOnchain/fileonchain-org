packages:
  - "apps/*"
  - "packages/*"
  # The seal-release GitHub Action runs the SDK from the workspace.
  - ".github/actions/*"

# pnpm 11 no longer reads the `pnpm` field of package.json. All install
# settings live here. See https://pnpm.io/settings.

# pnpm 11 defaults minimumReleaseAge to 1440 minutes (24h). We pin to 0 to
# match the pre-v11 behavior — Renovate bumps flow through immediately.
minimumReleaseAge: 1440

# pnpm 11.25 added explicit task-graph scheduling (ERR_PNPM_TASK_CYCLE).
# @fileonchain/sdk#build, @fileonchain/api#build, and
# @fileonchain/verify#build form a deliberate build cycle, which the new
# scheduler would otherwise refuse to run. Downgrade the cycle to a warning
# so the previous arbitrary-order execution is restored.
ignoreWorkspaceCycles: true

overrides:
  "@polkadot/util": "14.0.3"
  "@polkadot/util-crypto": "14.0.3"
  # Pinned to keep the @scure/sr25519 SWC minify happy (see CLAUDE.md gotchas).
  "@polkadot/keyring": "14.0.3"
  "@polkadot/api": "17.0.2"
  "@polkadot/types": "17.0.2"
  typescript: "^7.0.0"
  vite: "^8.0.0"

# Replaces the old onlyBuiltDependencies array. Listed deps still run their
# install scripts; anything else fails with ERR_PNPM_IGNORED_BUILDS unless
# `strictDepBuilds=false` is set.
allowBuilds:
  '@openrouter/sdk': true
  '@reown/appkit': true
  bufferutil: true
  chacha-native: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  # chacha-native (optional dep of `chacha`, used by @cardano-sdk/) fails to
  # build under Node 22: it still references v8::Object::CreationContext(),
  # removed in newer V8. `chacha` falls back to its pure-JS implementation
  # when the native binding is missing, so skipping the build is safe.

# tsup 9's bundled rollup-plugin-dts already falls back to
# `@typescript/typescript6` on its own, but tsup's own dts plumbing
# (`src/rollup.ts` -> dist/rollup.js, `src/tsc.ts` -> dist/index.js) still
# `require('typescript')` and calls the compiler API (`parseJsonConfigFileContent`,
# `sys`, `createProgram`) that TS 7 removed — typescript@7 only ships a version
# stub. Patch those requires to load `@typescript/typescript6` (the TS 6 API
# shim) instead so dts generation works under either TS major.
patchedDependencies:
  tsup@9.0.0: patches/tsup@9.0.0.patch